[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxgb"
version = "0.1.0"
description = "RXGB: A bagging ensemble of shallow XGBoost learners for classification and regression"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Kiarash Nouri", email = "kia1391n@gmail.com" }
]
keywords = ["machine learning", "ensemble", "xgboost", "bagging", "random forest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "xgboost>=1.7",
    "scikit-learn>=1.0",
    "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/Kia_ML/rxgb"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]