[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxgb"
version = "0.2.2"
description = "RXGB: Advanced bagging and deep cascaded ensembles of XGBoost learners."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Kiarash Nouri", email = "kia1391n@gmail.com" }
]
keywords = ["machine learning", "ensemble", "xgboost", "bagging", "deep learning", "cascaded architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "xgboost>=1.7",
    "scikit-learn>=1.0",
    "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/Kia-ML/rxgb"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
